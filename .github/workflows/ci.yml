name: CI

# This workflow does NOT deploy. Deployment is handled by Cloudflare Workers
# Builds (the Git integration configured on the `custom-wayback-api` Worker),
# which triggers on every push to main and authenticates with its own token.
# See the "Continuous deployment" section of the README for the build settings.
#
# The reason there is no deploy job here: `wrangler deploy` for this Worker
# needs Workers Scripts/KV/R2 edit and Queues edit on the account, and the
# hand-made CLOUDFLARE_API_TOKEN only ever carried D1. Every deploy attempt
# failed at the asset upload with "No access to the specified resource". Rather
# than depend on a token that has to be kept in sync with the bindings in
# wrangler.toml, the deploy moved to Workers Builds, whose token Cloudflare
# generates and scopes for the Worker itself.
#
# CI's job is therefore to be the gate Workers Builds is not: secret scanning,
# typechecking and the real test suite.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Secret scanning (gitleaks) ───────────────────────────────────────────
  # Runs first and alone so a leaked credential fails in ~10s instead of after a
  # full build, and so nothing downstream ever runs on a commit that contains one.
  scan-secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Exit 1 (fail the build) if any secret is found.

  # ── 2. Typecheck + lint ─────────────────────────────────────────────────────
  typecheck:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    needs: [scan-secrets]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.14.4"

      - uses: actions/setup-node@v4
        with:
          # Tracks latest 22.x. The floor is 22.6, not 22.5: `node:sqlite` lands in
          # 22.5, but apps/crawler-local's test script also passes
          # --experimental-strip-types, which only exists from 22.6 ("node: bad
          # option" below that). Both are flagged experimental, hence the
          # --experimental-* flags in the crawler's scripts.
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        # `typecheck` depends on `^build` in turbo.json, so this also compiles the
        # workspace packages the API imports at runtime.
        run: pnpm turbo run typecheck

      - name: Lint
        # There is no ESLint config in this repo yet (no eslint.config.* and no
        # .eslintrc* anywhere outside node_modules), so every workspace's lint
        # script exits 2 with "couldn't find a configuration file". Non-blocking
        # by design: this step becomes a real gate the moment a config lands.
        run: pnpm turbo run lint
        continue-on-error: true

  # ── 3. Build ────────────────────────────────────────────────────────────────
  # This is also what compiles `packages/pipeline` and `packages/shared` to their
  # `dist/` directories. Those outputs are load-bearing for deploys: `apps/api`
  # imports both via their package.json `exports` (`./dist/index.js`), and
  # `wrangler deploy` bundles from source with esbuild, so a missing dist is 17
  # "Could not resolve @custom-wayback/..." errors. Workers Builds runs the same
  # command (see the README), so this job is also the place a broken build
  # surfaces first, before Cloudflare ever sees the commit.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.14.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build

  # ── 4. Tests ────────────────────────────────────────────────────────────────
  # The gate Workers Builds does not provide. Gated on `build` because
  # `turbo run test` declares `dependsOn: ["^build"]`: the API's tests bundle the
  # shipping module graph with the same esbuild that `wrangler deploy` uses,
  # against the built workspace packages.
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.14.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm turbo run test
