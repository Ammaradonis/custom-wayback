name: CI

# Every push to main deploys to Cloudflare Workers, from the `deploy` job below.
#
# The pipeline is deliberately ordered so nothing reaches production without
# passing the gate: gitleaks → typecheck → build → tests → deploy.
#
# Requires two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The token must carry, all Account-scoped: Workers Scripts (edit), Workers KV
# Storage (edit), Workers R2 Storage (edit), Cloudflare Queues (edit) and
# D1 (edit). Missing any of them fails a different step — Workers Scripts at the
# asset upload ("No access to the specified resource"), Queues while configuring
# the bindings in wrangler.toml — so it is worth checking all five when rotating.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Secret scanning (gitleaks) ───────────────────────────────────────────
  # Runs first and alone so a leaked credential fails in ~10s instead of after a
  # full build, and so nothing downstream ever runs on a commit that contains one.
  scan-secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Exit 1 (fail the build) if any secret is found.

  # ── 2. Typecheck + lint ─────────────────────────────────────────────────────
  typecheck:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    needs: [scan-secrets]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.14.4"

      - uses: actions/setup-node@v4
        with:
          # Tracks latest 22.x. The floor is 22.6, not 22.5: `node:sqlite` lands in
          # 22.5, but apps/crawler-local's test script also passes
          # --experimental-strip-types, which only exists from 22.6 ("node: bad
          # option" below that). Both are flagged experimental, hence the
          # --experimental-* flags in the crawler's scripts.
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        # `typecheck` depends on `^build` in turbo.json, so this also compiles the
        # workspace packages the API imports at runtime.
        run: pnpm turbo run typecheck

      - name: Lint
        # There is no ESLint config in this repo yet (no eslint.config.* and no
        # .eslintrc* anywhere outside node_modules), so every workspace's lint
        # script exits 2 with "couldn't find a configuration file". Non-blocking
        # by design: this step becomes a real gate the moment a config lands.
        run: pnpm turbo run lint
        continue-on-error: true

  # ── 3. Build ────────────────────────────────────────────────────────────────
  # This is also what compiles `packages/pipeline` and `packages/shared` to their
  # `dist/` directories, which `apps/api` imports via their package.json
  # `exports` (`./dist/index.js`). The deploy job rebuilds them for itself (a
  # fresh checkout has no dist and `pnpm install` does not run build scripts);
  # this job exists so a broken build fails before a deploy is attempted, and to
  # produce the web bundle the deploy job downloads.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.14.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # ── 4. Tests ────────────────────────────────────────────────────────────────
  # Gated on `build` because `turbo run test` declares `dependsOn: ["^build"]`:
  # the API's tests bundle the shipping module graph with the same esbuild that
  # `wrangler deploy` uses, against the built workspace packages.
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.14.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm turbo run test

  # ── 5. Deploy to Cloudflare Workers (main branch only) ──────────────────────
  # Runs only after the tests pass, so a commit that breaks the suite never
  # reaches production.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.14.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A fresh checkout has no `packages/*/dist`, and `pnpm install` does not
      # create them: the workspace packages' `build` scripts are only run by
      # `pnpm turbo run build`. Without this step `wrangler deploy` fails with
      # "Could not resolve @custom-wayback/shared" (and @custom-wayback/pipeline).
      - name: Build workspace packages
        run: pnpm turbo run build --filter=@custom-wayback/api...

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # Migrations run before the deploy so the Worker never starts serving code
      # that expects a column the remote D1 does not have yet.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: |
          pnpm exec wrangler d1 migrations apply custom-wayback-ledger --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `[assets] directory = "../web/dist"` in wrangler.toml is resolved relative
      # to apps/api, which is why this step is scoped there and why the web build
      # is downloaded to exactly that path above.
      - name: Deploy Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 6. Preview deploy (PRs only) ─────────────────────────────────────────────
  # Deploys the `env.dev` Worker (`custom-wayback-api-dev`) using the same
  # wrangler.toml, so a PR can be exercised without touching production.
  preview:
    name: Preview deploy
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9.14.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same reason as the deploy job: `wrangler deploy` needs packages/*/dist.
      - name: Build workspace packages
        run: pnpm turbo run build --filter=@custom-wayback/api...

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy preview
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
