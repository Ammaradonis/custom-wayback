# Local development stack.
# Starts MinIO as an R2-compatible object store.
# The wrangler dev Worker and crawl CLI connect to it via STORAGE_* env vars.
#
# Usage:
#   docker compose up -d        # start MinIO
#   docker compose down         # stop
#   docker compose down -v      # stop + wipe data

version: "3.9"

services:
  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO web console (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot init: create the dev bucket so you don't have to do it manually.
  minio-init:
    image: minio/mc:RELEASE.2024-12-17T17-26-20Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/custom-wayback-dev &&
        echo 'Bucket ready.'
      "
    restart: "no"

volumes:
  minio-data:
