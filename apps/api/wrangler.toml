name = "custom-wayback-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# ── CPU limit ────────────────────────────────────────────────────────────────
# plan.md §11.5 asks for a per-invocation CPU ceiling so a pathological archived
# page cannot burn the whole allotment. That setting is deliberately absent:
#
#   Cloudflare rejects `[limits] cpu_ms` on the Free plan --
#   "CPU limits are not supported for the Free plan. Switch to a paid plan".
#
# The practical ceiling still exists (the runtime kills an invocation that spins),
# it is just not configurable here. On the Workers Paid plan, reinstate:
#
#   [limits]
#   cpu_ms = 30_000
#
# The other guardrails in this file -- MONTHLY_BUDGET_USD, CRAWL_QUOTA_PER_DAY,
# MAX_PAGES_PER_MONTH and the queue consumer's per-message request budget -- are
# the ones that actually bound cost, and none of them need a paid plan.

# ── D1 ledger ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding      = "DB"
database_name = "custom-wayback-ledger"
database_id  = "26bbcdbb-5d59-416e-bea0-9bb4968e20d7"
migrations_dir = "../../packages/shared/migrations"

# ── R2 bucket ────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding     = "STORAGE"
bucket_name = "custom-wayback"

# ── Cloudflare Queues ─────────────────────────────────────────────────────────
#
# HOW POLITENESS IS ENFORCED IN THE CLOUD (plan.md §12 rule 3)
# -----------------------------------------------------------
# The local runner serializes requests per host inside one process. A Worker
# cannot: invocations are short and may overlap. So the 1-request-per-second rule
# is enforced by *configuration* here, and by a per-invocation request budget in
# `src/queue/fetch.ts`:
#
#   max_concurrency  ×  requests-per-message  ≈  requests in flight
#   max_batch_size   ×  per-request min delay  ≈  spacing
#
# With the values below: at most 2 messages in flight, each spending at most 8
# archive.org requests with a 900 ms floor between them. That keeps the observed
# rate at or under ~1 rps against archive.org, with the circuit breaker in
# `src/queue/ingest.ts` as the backstop when it is not enough.
#
# Do not raise `max_concurrency` without also re-reading §12. The cost of being
# wrong is not a bill — it is losing access to the archive this tool depends on.

[[queues.producers]]
binding    = "INGEST_QUEUE"
queue      = "custom-wayback-ingest"

[[queues.producers]]
binding    = "DLQ_QUEUE"
queue      = "custom-wayback-ingest-dlq"

[[queues.consumers]]
queue                = "custom-wayback-ingest"
max_batch_size       = 2
max_batch_timeout    = 5
max_retries          = 5
max_concurrency      = 2
dead_letter_queue    = "custom-wayback-ingest-dlq"

# The dead-letter queue is consumed too — nothing is ever silently dropped, it is
# recorded in D1 as a failed ingest with the reason attached.
[[queues.consumers]]
queue             = "custom-wayback-ingest-dlq"
max_batch_size    = 10
max_batch_timeout = 30
max_retries       = 3
max_concurrency   = 1

# ── Cron Triggers ────────────────────────────────────────────────────────────
# Every 5 minutes:
#   1. purge R2 blobs for pages already served past the grace period
#   2. prune expired rate-limit windows (an unbounded counter table is a bill)
#   3. re-drive jobs whose consumer was evicted mid-batch
[triggers]
crons = ["*/5 * * * *"]

# ── KV (coverage-bar cache) ───────────────────────────────────────────────────
[[kv_namespaces]]
binding = "COVERAGE_KV"
id      = "3c44c2ecae654b1cab2de4c78ca38245"

# ── Static assets ────────────────────────────────────────────────────────────
# Workers Static Assets serves the Vite build; dynamic routes go to this Worker.
# Asset requests are free and unlimited, which is exactly the traffic profile of
# a cached-archive reader (plan.md §4).
#
# `not_found_handling = "single-page-application"` is load-bearing, not a nicety:
# without it, a deep link the React Router would handle — `/register`, or
# `/samsung.com/2024/03/15/` from a shared link — is answered by the asset server
# with a 404 *before* the Worker's own fallthrough ever runs. That breaks the
# §2.1 promise that every view is a shareable, back-button-correct URL, and it
# breaks it only on a cold load, which is the hardest kind to notice in testing.
[assets]
directory = "../web/dist"
binding   = "ASSETS"
not_found_handling = "single-page-application"

# ── Observability ────────────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

# ── Secrets (set via `wrangler secret put <name>`) ───────────────────────────
# JWT_SECRET              — HS256 signing secret, ≥ 32 random bytes
# STORAGE_ACCESS_KEY_ID   — R2 bucket-scoped key (write-only for crawler)
# STORAGE_SECRET_ACCESS_KEY
# STORAGE_ENDPOINT        — https://<account_id>.r2.cloudflarestorage.com
# STORAGE_BUCKET_NAME

# ── Environment vars (non-secret) ────────────────────────────────────────────
[vars]
CRAWLER_USER_AGENT   = "CustomWaybackBot/1.0 (+https://REPLACE_WITH_YOUR_DOMAIN/bot)"
MAX_PAGES_PER_MONTH  = "1000"
SNAPSHOT_BEHAVIOR    = "nearest"
PURGE_GRACE_SECONDS  = "1800"
# Throttling + cost guardrails (plan.md §11.5). These are the knobs that bound
# what the tool can cost you in a month, so they are vars, not secrets, and they
# are echoed back to the UI by GET /v1/usage/limits.
CRAWL_QUOTA_PER_DAY  = "8"
MONTHLY_BUDGET_USD   = "25"

# ── Preview / dev environment ─────────────────────────────────────────────────
# `wrangler dev` and `wrangler deploy --env dev` run entirely against local
# Miniflare state: local D1, local R2, local Queues. No cloud spend, and no
# archive.org traffic unless a crawl is actually started.
[env.dev]
name = "custom-wayback-api-dev"

[env.dev.vars]
CRAWLER_USER_AGENT  = "CustomWaybackBot/1.0-dev"
MAX_PAGES_PER_MONTH = "50"
CRAWL_QUOTA_PER_DAY = "50"
MONTHLY_BUDGET_USD  = "5"

[[env.dev.queues.producers]]
binding = "INGEST_QUEUE"
queue   = "custom-wayback-ingest-dev"

[[env.dev.queues.producers]]
binding = "DLQ_QUEUE"
queue   = "custom-wayback-ingest-dlq-dev"

[[env.dev.queues.consumers]]
queue             = "custom-wayback-ingest-dev"
max_batch_size    = 1
max_batch_timeout = 2
max_retries       = 3
max_concurrency   = 1
dead_letter_queue = "custom-wayback-ingest-dlq-dev"

[[env.dev.queues.consumers]]
queue             = "custom-wayback-ingest-dlq-dev"
max_batch_size    = 10
max_batch_timeout = 30
max_retries       = 3
max_concurrency   = 1
