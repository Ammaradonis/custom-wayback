<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!--
      Both themes are first-class. This is declared in the markup, not only in
      CSS, so the browser paints the canvas and any native control in the right
      scheme on the very first frame — before the stylesheet has loaded and long
      before React mounts. Without it there is a white flash on a dark-mode device
      and the initial scrollbar and form controls come out light.

      `light dark` means "follow the OS preference", which the CSS tokens in
      src/styles/tokens.css answer with a value for each scheme via light-dark().
    -->
    <meta name="color-scheme" content="light dark" />

    <!-- Matched to --color-background in both schemes so the mobile browser
         chrome and the PWA splash do not contrast with the page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1220" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Custom Wayback</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- manifest.webmanifest is injected by vite-plugin-pwa at build time -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
