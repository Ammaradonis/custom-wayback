packages:
  - "apps/*"
  - "packages/*"
  # crawler-local is the Phase 1 local runner (already matched by apps/*, listed
  # explicitly because its data/ directory is git-ignored). It depends on
  # packages/pipeline for the shared ingest logic.
  - "apps/crawler-local"

# pnpm 10 does not run dependency lifecycle scripts unless they are allowlisted.
# Nothing in this workspace needs one, but esbuild/workerd are common additions
# for the api and web apps, so declare the intent explicitly.
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
